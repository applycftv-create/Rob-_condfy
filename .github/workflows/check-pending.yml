name: Verificar solicitações faciais pendentes (Condfy)

on:
  # Agendamento automático DESATIVADO propositalmente: o robô roda via cron
  # no servidor próprio (ver README), para não duplicar notificações.
  # Descomente as linhas abaixo se quiser voltar a usar o GitHub Actions
  # como o sistema principal (e desative o cron do servidor nesse caso).
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-pending-condfy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar verificação
        env:
          CONDFY_USERNAME: ${{ secrets.CONDFY_USERNAME }}
          CONDFY_PASSWORD: ${{ secrets.CONDFY_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
        run: python scripts/check_pending.py

      - name: Salvar artefatos de depuração (se houver)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_id }}
          path: debug_artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persistir estado de notificações já enviadas
        run: |
          # state/notified.json está no .gitignore (evita conflito de git pull
          # em deploys via cron, onde o arquivo é um cache local por servidor).
          # Aqui no Actions o container é efêmero, então precisamos forçar o
          # commit para persistir o estado entre execuções.
          git config user.name "condfy-bot"
          git config user.email "condfy-bot@users.noreply.github.com"
          git add -f state/notified.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança de estado para commitar."
          else
            git commit -m "chore: atualizar estado de notificações"
            git push
          fi
